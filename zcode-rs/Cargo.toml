[package]
name = "zcode-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Independent Rust + GPUI coding agent aligned with ZCode's core behavior"
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:gpui"]

[[bin]]
name = "zcode-rs"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { version = "0.2.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "std"] }

[profile.dev.package."*"]
debug = false

# gpui 0.2.2 pulls xattr 0.2.3, which no longer builds against current libc.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
